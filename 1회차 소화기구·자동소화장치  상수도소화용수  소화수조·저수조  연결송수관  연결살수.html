<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화재안전기준(NFPC+NFTC) 통합 시퀀스 암기 학습기 — 1회차</title>
<style>
  :root {
    --bg: #080d18;
    --panel: #111827;
    --card: #182235;
    --border: #2c3b52;
    --text: #f1f5f9;
    --sub: #94a3b8;
    --blue: #38bdf8;
    --cyan: #22d3ee;
    --amber: #f59e0b;
    --red: #ef4444;
    --green: #10b981;
    --purple: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  header {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    border-bottom: 2px solid var(--cyan);
    padding: 13px 20px;
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 60;
  }
  .brand h1 { font-size: 1.12rem; color: #fff; }
  .brand p { font-size: 0.77rem; color: var(--cyan); margin-top: 2px; }
  .toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .toolbar input { background: #080d18; border: 1px solid var(--border); color: #fff; padding: 7px 11px; border-radius: 7px; width: 225px; font-size: 0.82rem; }
  .toolbar input:focus { outline: none; border-color: var(--cyan); }
  .btn { padding: 6px 11px; border-radius: 7px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 0.78rem; font-weight: 700; cursor: pointer; transition: 0.15s; }
  .btn:hover { border-color: var(--blue); background: #223047; }
  .btn.blank-on { background: #b45309; border-color: #fde68a; color: #fff; box-shadow: 0 0 12px rgba(245,158,11,0.45); }
  .btn.quiz-btn { background: #0369a1; border-color: var(--blue); color: #fff; }
  .btn.active-filter { background: var(--cyan); border-color: #cffafe; color: #080d18; }

  .progress-strip { background: #0d1424; border-bottom: 1px solid var(--border); padding: 8px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.78rem; }
  .prog-bar-wrap { flex: 1; min-width: 140px; max-width: 380px; height: 10px; background: #1e293b; border-radius: 999px; overflow: hidden; }
  .prog-bar-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--green)); width: 0%; transition: width 0.3s; }

  .layout { display: grid; grid-template-columns: 285px 1fr; min-height: calc(100vh - 110px); }
  @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } aside { border-right: none; border-bottom: 1px solid var(--border); } }

  aside { background: var(--panel); border-right: 1px solid var(--border); padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  .nav-group-label { font-size: 0.72rem; color: var(--amber); font-weight: 700; padding: 9px 8px 3px; }
  .nav-item { text-align: left; padding: 7px 10px; border-radius: 7px; border: 1px solid transparent; background: transparent; color: #cbd5e1; font-size: 0.79rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .nav-item:hover { background: var(--card); color: #fff; }
  .nav-item.active { background: rgba(34,211,238,0.14); border-color: rgba(34,211,238,0.55); color: var(--cyan); font-weight: 700; }
  .nav-badge { font-size: 0.68rem; padding: 1px 6px; border-radius: 999px; background: #0a101d; color: var(--sub); white-space: nowrap; }

  main { padding: 18px 20px 55px; overflow-x: hidden; }
  .module-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .module-header h2 { font-size: 1.08rem; color: var(--cyan); }
  .module-header span { font-size: 0.8rem; color: var(--sub); }

  .section-divider { margin: 20px 0 12px; padding: 9px 14px; border-radius: 8px; background: linear-gradient(90deg, rgba(34,211,238,0.16), rgba(15,23,42,0.4)); border-left: 4px solid var(--cyan); font-size: 0.94rem; font-weight: 700; color: #cffafe; }
  .hl-num { color: #fde68a; font-weight: 700; background: rgba(245,158,11,0.14); padding: 0 3px; border-radius: 3px; }
  .blank-chip { display: inline-block; background: #273549; color: transparent; border: 1.5px dashed var(--cyan); border-radius: 4px; padding: 0 6px; margin: 0 1px; cursor: pointer; user-select: none; text-shadow: 0 0 9px rgba(34,211,238,0.5); }
  .blank-chip:hover { border-color: #fff; background: #334155; }
  .blank-chip.revealed { color: #fde68a; background: rgba(245,158,11,0.25); border: 1.5px solid var(--amber); font-weight: 700; text-shadow: none; }

  .rung { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .rung.memorized { border-left: 4px solid var(--green); }
  .rung.energized { border-color: var(--green); box-shadow: 0 0 12px rgba(16,185,129,0.2); }
  .rung.energized-pen { border-color: var(--red); box-shadow: 0 0 12px rgba(239,68,68,0.25); }
  .rung-top { background: #141e32; padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid var(--border); }
  .rung-title { font-size: 0.88rem; font-weight: 700; color: #f8fafc; }
  .rung-sub-tip { background: rgba(56,189,248,0.08); border-bottom: 1px solid #1e293b; padding: 6px 14px; font-size: 0.77rem; color: #7dd3fc; }

  .ladder-flow { display: flex; align-items: stretch; padding: 11px 10px; overflow-x: auto; background: #0a101d; }
  .rail-left, .rail-right { width: 5px; min-width: 5px; border-radius: 3px; }
  .rail-left { background: var(--red); }
  .rail-right { background: var(--blue); }
  .wire-seg { display: flex; align-items: center; padding: 0 2px; }
  .wire-line { width: 14px; height: 3px; background: #475569; }
  .wire-line.hot { background: var(--amber); box-shadow: 0 0 5px var(--amber); }

  .node { background: var(--card); border: 1.5px solid #475569; border-radius: 7px; padding: 7px 10px; min-width: 150px; max-width: 310px; font-size: 0.78rem; cursor: pointer; display: flex; flex-direction: column; justify-content: center; }
  .node:hover { border-color: var(--cyan); }
  .node-head { font-family: monospace; font-size: 0.71rem; font-weight: 700; margin-bottom: 3px; }
  .node.type-a .node-head { color: var(--blue); }
  .node.type-b .node-head { color: var(--amber); }
  .node.type-t .node-head { color: var(--purple); }
  .node.type-c .node-head { color: var(--cyan); }
  .node.closed { border-color: var(--amber); background: rgba(245,158,11,0.12); }
  .node.type-b.tripped { border-color: var(--red); border-style: dashed; opacity: 0.7; }

  .or-group { border: 1.5px dashed #475569; border-radius: 8px; padding: 6px; background: rgba(15,23,42,0.7); display: flex; flex-direction: column; gap: 5px; min-width: 245px; max-width: 490px; }
  .or-label { font-size: 0.68rem; color: var(--cyan); font-weight: 700; font-family: monospace; }
  .or-item { background: var(--card); border: 1px solid #3b4b63; border-radius: 5px; padding: 5px 8px; font-size: 0.76rem; cursor: pointer; display: flex; gap: 6px; align-items: flex-start; }
  .or-item:hover { border-color: var(--cyan); }
  .or-item.on { border-color: var(--amber); background: rgba(245,158,11,0.16); }
  .or-sym { font-family: monospace; color: var(--blue); font-weight: 700; white-space: nowrap; }

  .coil { border-radius: 18px; padding: 8px 12px; min-width: 185px; max-width: 340px; font-size: 0.78rem; border: 2px solid #475569; background: #131c2e; display: flex; flex-direction: column; justify-content: center; }
  .coil-head { font-family: monospace; font-size: 0.71rem; font-weight: 700; margin-bottom: 3px; }
  .coil.type-out .coil-head { color: var(--green); }
  .coil.type-pen .coil-head { color: #fca5a5; }
  .coil.type-out.on { border-color: var(--green); background: rgba(16,185,129,0.18); }
  .coil.type-pen.on { border-color: var(--red); background: rgba(239,68,68,0.22); }

  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .study-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 15px; }
  .study-card h3 { font-size: 0.94rem; color: var(--amber); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  th, td { border: 1px solid var(--border); padding: 7px 9px; text-align: left; vertical-align: top; }
  th { background: #0f172a; color: var(--blue); }
  tr:nth-child(even) { background: rgba(24,34,53,0.5); }
  .mnemonic-badge { display: inline-block; background: rgba(167,139,250,0.2); border: 1px solid var(--purple); color: #ddd6fe; padding: 2px 8px; border-radius: 6px; font-size: 0.76rem; font-weight: 700; margin-bottom: 7px; }

  .quiz-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; max-width: 900px; }
  .quiz-q { font-size: 1rem; font-weight: 700; margin: 12px 0 14px; color: #fff; }
  .quiz-opts { display: flex; flex-direction: column; gap: 8px; }
  .quiz-opt { text-align: left; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 0.86rem; cursor: pointer; }
  .quiz-opt:hover { border-color: var(--cyan); }
  .quiz-opt.correct { background: rgba(16,185,129,0.22); border-color: var(--green); color: #a7f3d0; font-weight: 700; }
  .quiz-opt.wrong { background: rgba(239,68,68,0.22); border-color: var(--red); color: #fecaca; }
  .quiz-exp { margin-top: 12px; padding: 11px 14px; border-radius: 8px; background: #0a101d; border-left: 4px solid var(--blue); font-size: 0.84rem; color: #cbd5e1; }

  .form-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.82rem; gap: 8px; }
  .form-row select, .form-row input { background: #080d18; border: 1px solid var(--border); color: #fff; padding: 5px 8px; border-radius: 5px; width: 175px; }
  .res-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .res-pill { font-size: 0.76rem; padding: 5px 9px; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: #64748b; }
  .res-pill.req { background: rgba(16,185,129,0.18); border-color: var(--green); color: #a7f3d0; font-weight: 700; }
  .res-pill.warn { background: rgba(239,68,68,0.22); border-color: var(--red); color: #fecaca; font-weight: 700; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>🔥 화재안전기준(NFPC+NFTC) 통합 시퀀스 암기 학습기</h1>
    <p>1회차: 소화기구·자동소화장치 / 상수도소화용수 / 소화수조·저수조 / 연결송수관 / 연결살수 (기준번호 X · 누락 없음)</p>
  </div>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="통합 검색 (예: 0.5m, 140m, K급, 70m)..." oninput="renderMain()">
    <button class="btn" id="btnBlank" onclick="toggleBlankMode()">🧠 빈칸 암기모드: OFF</button>
    <button class="btn" onclick="revealAllBlanks()">👁️ 현재 빈칸 열기</button>
    <button class="btn quiz-btn" onclick="switchView('quiz')">📝 실전 암기 퀴즈</button>
  </div>
</header>

<div class="progress-strip">
  <div><strong>📚 전체 암기 진도:</strong> <span id="progText">0 / 0 완료 (0%)</span></div>
  <div class="prog-bar-wrap"><div class="prog-bar-fill" id="progFill"></div></div>
  <div style="display:flex; gap:5px; flex-wrap:wrap;">
    <button class="btn" onclick="energizeAllVisible()">⚡ 일괄 통전</button>
    <button class="btn" onclick="resetContacts()">🔄 접점 리셋</button>
    <button class="btn" onclick="exportProgress()">💾 진도 백업</button>
    <button class="btn" onclick="document.getElementById('importFile').click()">📂 진도 복원</button>
    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importProgress(event)">
    <button class="btn" onclick="resetProgress()">🧹 초기화</button>
  </div>
</div>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="mainArea"></main>
</div>

<script>
const MODULES = [
  { id: 'study_num', group: 'study', name: '⏱ 수치·규격 총정리 매트릭스', desc: '1회차 5설비 모든 거리·높이·압력·구경·용량·온도 수치 통합 비교표' },
  { id: 'study_trap', group: 'study', name: '⚡ 두문자 & 함정 비교노트', desc: '0.5~1m/1.5m/0.8~1.5m 높이 비교, 배관재질·겸용·감소·설치제외 함정' },
  { id: 'quiz', group: 'study', name: '📝 실전 암기 퀴즈 (25문항)', desc: '설비별 필터링 + 오답 집중 복습 지원' },
  { id: 'sim', group: 'study', name: '🎛️ 공학 계산 시뮬레이터 (3종)', desc: '소화기구 능력단위·감소 / 소화수조 수량·채수구·양수량 / 연결송수관 펌프·토출량' },

  // ==================== 1. 소화기구 및 자동소화장치 ====================
  {
    id: 's101_a', group: 'seq', cat: '1회차: 소화기구 · 용수 · 연결수계',
    name: '1. [소화기구] 적응성 · 능력단위 · 부속용도 · 감소',
    desc: '화재별 적응성(A·B·C·K·D), 능력단위 면적, 부속용도 7종 추가, 소형·대형 감소 기준',
    rungs: [
      {
        title: '화재종류(A·B·C·K·D) · 소화기 구분 · 간이소화용구 능력단위', tag: '정의·적응성',
        tip: '💡 {{할론}}은 A급 적응성 없음(B·C만)! | {{D급(금속화재)}}=마른모래·팽창질석·팽창진주암 등 | 대형소화기={{A급 10단위}}↑·{{B급 20단위}}↑!',
        steps: [
          { type: 'or', items: [
            '{{A급(일반·재 남음)}}: CO₂·할론 제외 전부 | {{B급(유류·재 안남음)}}: 전부 적응 | {{C급(전기)}}: CO₂·할론·할로겐·분말·고체에어로졸(*산알칼리·강화액·물침윤)',
            '{{K급(주방·동식물유)}}: *인산염류·중탄산염류·산알칼리·강화액·포·물침윤·그밖 | {{D급(금속·마그네슘 등)}}: 마른모래·팽창질석·팽창진주암(*인산염류·중탄산염류·그밖)',
            '소형(1단위↑~대형 미만) / 대형(운반대·바퀴, A급 {{10단위}}↑·B급 {{20단위}}↑) / 간이소화용구(삽 상비 마른모래 {{50L}}↑ 1포={{0.5단위}}, 팽창질석·진주암 {{80L}}↑ 1포={{0.5단위}})'
          ]},
          { type: 'out', text: '설치장소 화재종류에 적응성 있는 소화약제 선정' }
        ]
      },
      {
        title: '특정소방대상물별 능력단위 및 거실·보행거리·표지 시퀀스', tag: '능력단위·배치',
        tip: '💡 면적 계단: 위락 {{30㎡}} | 문집(전시·동식물외)·의료·장례·문화재 {{50㎡}} | 공동·근생·전시 등 {{100㎡}} | 그외 {{200㎡}} (내화+불연·준불연·난연 시 {{2배}}!)',
        steps: [
          { type: 'c', text: '능력단위 1단위 기준 바닥면적: 위락 {{30㎡}} / 문화집회(전시장·동식물원 외)·의료·장례식장·문화재 {{50㎡}} / 공동주택·근생·전시장·판매·운수·노유·업무·숙박·공장·창고·항공자동차·방송·관광휴게 {{100㎡}} / 그밖 {{200㎡}} (주요구조부 내화+벽반자 불연·준불연·난연 시 {{2배}})' },
          { type: 'a', text: '각 층 배치(2↑ 거실 구획 시 {{33㎡}}↑ 각 거실 배치) · 보행거리(소형 {{20m}}↓ / 대형 {{30m}}↓, 불연작업장 완화) · 간이소화용구 전체의 {{1/2}} 초과 금지(노유자 제외)' },
          { type: 'out', text: '바닥높이 {{1.5m}} 이하 비치 + 축광표지(소화기·투척용; 주차장은 표지 바닥 {{1.5m}} 이상) / CO₂·할로겐 소화기구(자동확산 외) 지하·무창·밀폐 {{20㎡}} 미만 금지(유효배기구 예외)' }
        ]
      },
      {
        title: '부속용도별(7종) 추가 설치 및 소형·대형 감소 시퀀스', tag: '부속용도·감소',
        tip: '💡 부속주방 {{25㎡}}마다 1단위({{1개↑ K급}}) & 자동확산({{10㎡↓}} 1개, {{10㎡초과}} 2개↑) | 감소제외: 11층↑ & 15개 용도({{무인변전소}}만 감소 가능)!',
        steps: [
          { type: 'or', items: [

// ==================== STATE & ENGINE ====================
let activeId = 'study_num';
let blankMode = false;
let quizFilter = 'ALL';
let quizIdx = 0, quizScore = 0, quizAnswered = false, wrongSet = new Set();
const stateMap = {};
const memMap = JSON.parse(localStorage.getItem('fire_std_mem_v1') || '{}');

function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatText(raw) {
  const re = /(?:\{\{([^}]+)\}\}|(\d+(?:,\d+)*(?:\.\d+)?\s*(?:일|개월|년|분|초|㎡|㎠|㎥|mm|cm|m|kg|L\/min|L|MPa|℃|V|단위|배|층|개소|개|배|시간|%)))/g;
  let last = 0, out = '', m;
  while ((m = re.exec(raw)) !== null) {
    out += escapeHtml(raw.slice(last, m.index));
    const val = m[1] || m[2];
    out += blankMode
      ? `<span class="blank-chip" onclick="event.stopPropagation(); this.classList.toggle('revealed')" title="클릭하여 정답 확인">${escapeHtml(val)}</span>`
      : `<span class="hl-num">${escapeHtml(val)}</span>`;
    last = re.lastIndex;
  }
  return out + escapeHtml(raw.slice(last));
}

function toggleBlankMode() {
  blankMode = !blankMode;
  const btn = document.getElementById('btnBlank');
  btn.textContent = blankMode ? '🧠 빈칸 암기모드: ON' : '🧠 빈칸 암기모드: OFF';
  btn.classList.toggle('blank-on', blankMode);
  renderMain();
}
function revealAllBlanks() { document.querySelectorAll('.blank-chip').forEach(el => el.classList.add('revealed')); }
function toggleMem(key) {
  memMap[key] = !memMap[key];
  localStorage.setItem('fire_std_mem_v1', JSON.stringify(memMap));
  updateProgress(); renderSidebar(); renderMain();
}
function resetProgress() {
  Object.keys(memMap).forEach(k => delete memMap[k]);
  localStorage.removeItem('fire_std_mem_v1');
  updateProgress(); renderSidebar(); renderMain();
}
function exportProgress() {
  const blob = new Blob([JSON.stringify({ memMap, wrong: Array.from(wrongSet) }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'fire_standards_progress.json'; a.click();
}
function importProgress(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.memMap) { Object.keys(memMap).forEach(k => delete memMap[k]); Object.assign(memMap, d.memMap); localStorage.setItem('fire_std_mem_v1', JSON.stringify(memMap)); }
      if (Array.isArray(d.wrong)) wrongSet = new Set(d.wrong);
      updateProgress(); renderSidebar(); renderMain(); alert('진도 복원 완료!');
    } catch { alert('올바른 백업 파일이 아닙니다.'); }
  };
  r.readAsText(f);
}

function updateProgress() {
  let total = 0, done = 0;
  MODULES.forEach(m => { if (m.rungs) { total += m.rungs.length; m.rungs.forEach((_, i) => { if (memMap[`${m.id}-${i}`]) done++; }); } });
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progText').textContent = `${done} / ${total} 시퀀스 랭 완료 (${pct}%)`;
  document.getElementById('progFill').style.width = pct + '%';
}

function renderSidebar() {
  const sb = document.getElementById('sidebar'); sb.innerHTML = '';
  const cats = [...new Set(MODULES.filter(m => m.group === 'seq').map(m => m.cat))];
  const addGroup = (label, list) => {
    const d = document.createElement('div'); d.className = 'nav-group-label'; d.textContent = label; sb.appendChild(d);
    list.forEach(m => {
      const b = document.createElement('button');
      b.className = 'nav-item' + (m.id === activeId ? ' active' : '');
      let badge = 'TOOL';
      if (m.id === 'quiz') badge = `${QUIZ_BANK.length}제`;
      else if (m.rungs) badge = `${m.rungs.filter((_, i) => memMap[`${m.id}-${i}`]).length}/${m.rungs.length}`;
      b.innerHTML = `<span>${m.name}</span><span class="nav-badge">${badge}</span>`;
      b.onclick = () => switchView(m.id);
      sb.appendChild(b);
    });
  };
  addGroup('★ 암기 · 퀴즈 · 계산기', MODULES.filter(m => m.group === 'study'));
  cats.forEach(c => addGroup('⚡ ' + c, MODULES.filter(m => m.cat === c)));
}
function switchView(id) { activeId = id; document.getElementById('searchInput').value = ''; renderSidebar(); renderMain(); }

function getRungState(key, steps) {
  if (!stateMap[key]) stateMap[key] = steps.map(st => st.type === 'b' ? false : (st.type === 'or' ? st.items.map(() => false) : false));
  return stateMap[key];
}
function computeRungFlow(steps, rState) {
  const wireHot = []; let flow = true;
  for (let i = 0; i < steps.length; i++) {
    wireHot.push(flow);
    const st = steps[i];
    if (st.type === 'out' || st.type === 'pen') continue;
    const closed = st.type === 'b' ? !rState[i] : (st.type === 'or' ? rState[i].some(Boolean) : !!rState[i]);
    if (!closed) flow = false;
  }
  return { wireHot, finalFlow: flow };
}

function renderMain() {
  const main = document.getElementById('mainArea');
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!q) {
    if (activeId === 'study_num') return renderNumberMatrix(main);
    if (activeId === 'study_trap') return renderTrapNotes(main);
    if (activeId === 'quiz') return renderQuiz(main);
    if (activeId === 'sim') return renderSimulator(main);
  }
  let list = [];
  if (q) {
    MODULES.filter(m => m.rungs).forEach(m => m.rungs.forEach((r, idx) => {
      const blob = (r.title + ' ' + (r.tip || '') + ' ' + r.steps.map(s => s.text || (s.items || []).join(' ')).join(' ')).toLowerCase();
      if (blob.includes(q)) list.push({ mod: m, rung: r, key: `${m.id}-${idx}` });
    }));
    main.innerHTML = `<div class="module-header"><h2>🔍 "${escapeHtml(q)}" 검색 결과 (${list.length}개)</h2><span>핵심 수치와 키워드를 클릭해 통전·빈칸 테스트를 해보세요.</span></div>`;
  } else {
    const mod = MODULES.find(m => m.id === activeId);
    mod.rungs.forEach((r, idx) => list.push({ mod, rung: r, key: `${mod.id}-${idx}` }));
    main.innerHTML = `<div class="module-header"><h2>${mod.name}</h2><span>${mod.desc}</span></div>`;
  }
  if (!list.length) { main.innerHTML += `<div style="padding:30px; text-align:center; color:#64748b;">검색 결과가 없습니다.</div>`; return; }

  list.forEach(({ rung, key }) => {
    const rState = getRungState(key, rung.steps);
    const { wireHot, finalFlow } = computeRungFlow(rung.steps, rState);
    const hasPen = rung.steps.some(s => s.type === 'pen');
    const isMem = !!memMap[key];
    const rungEl = document.createElement('div');
    rungEl.className = 'rung' + (isMem ? ' memorized' : '') + (finalFlow ? (hasPen ? ' energized-pen' : ' energized') : '');
    const top = document.createElement('div'); top.className = 'rung-top';
    top.innerHTML = `<div class="rung-title">${rung.title}</div><div style="display:flex;gap:6px;"><button class="btn" onclick="toggleMem('${key}')" style="${isMem?'background:#065f46;border-color:#10b981;color:#fff;':''}">${isMem?'✅ 암기완료':'⬜ 암기체크'}</button><button class="btn" onclick="toggleWholeRung('${key}')">${finalFlow?'⚡ 차단':'▶ 일괄통전'}</button></div>`;
    rungEl.appendChild(top);
    if (rung.tip) { const tipEl = document.createElement('div'); tipEl.className = 'rung-sub-tip'; tipEl.innerHTML = formatText(rung.tip); rungEl.appendChild(tipEl); }
    const flowDiv = document.createElement('div'); flowDiv.className = 'ladder-flow'; flowDiv.innerHTML = `<div class="rail-left"></div>`;
    rung.steps.forEach((st, sIdx) => {
      const wSeg = document.createElement('div'); wSeg.className = 'wire-seg'; wSeg.innerHTML = `<div class="wire-line ${wireHot[sIdx]?'hot':''}"></div>`; flowDiv.appendChild(wSeg);
      if (st.type === 'or') {
        const grp = document.createElement('div'); grp.className = 'or-group'; grp.innerHTML = `<div class="or-label">OR 병렬 분기 (택1 충족 시 도통)</div>`;
        st.items.forEach((txt, iIdx) => {
          const isOn = rState[sIdx][iIdx];
          const item = document.createElement('div'); item.className = 'or-item' + (isOn ? ' on' : '');
          item.innerHTML = `<span class="or-sym">${isOn?'┤●├─':'┤ ├─'}</span><span>${formatText(txt)}</span>`;
          item.onclick = () => { rState[sIdx][iIdx] = !rState[sIdx][iIdx]; renderMain(); };
          grp.appendChild(item);
        });
        flowDiv.appendChild(grp);
      } else if (st.type === 'out' || st.type === 'pen') {
        const coil = document.createElement('div'); coil.className = `coil type-${st.type}` + (finalFlow?' on':'');
        coil.innerHTML = `<div class="coil-head">${st.type==='pen'?'(🚨 금지·제재 출력)':'(✅ 기준 적합/설치)'}</div><div>${formatText(st.text)}</div>`;
        flowDiv.appendChild(coil);
      } else {
        const node = document.createElement('div'); const val = rState[sIdx];
        let cls = `node type-${st.type}`, sym = '┤ ├─ a접점';
        if (st.type === 'a') { if (val) cls += ' closed'; sym = val ? '┤●├─ ON' : '┤ ├─ AND'; }
        else if (st.type === 'b') { cls += val ? ' tripped' : ' closed'; sym = val ? '┤/├─ 차단(예외)' : '┤/├─ 단서(정상)'; }
        else if (st.type === 't') { if (val) cls += ' closed'; sym = val ? '⏱ [T 완료]' : '⏱ [T 타이머]'; }
        else if (st.type === 'c') { if (val) cls += ' closed'; sym = val ? '⚖ [기준충족]' : '⚖ [비교기]'; }
        node.className = cls; node.innerHTML = `<div class="node-head">${sym}</div><div>${formatText(st.text)}</div>`;
        node.onclick = () => { rState[sIdx] = !rState[sIdx]; renderMain(); };
        flowDiv.appendChild(node);
      }
    });
    const endW = document.createElement('div'); endW.className = 'wire-seg'; endW.innerHTML = `<div class="wire-line ${finalFlow?'hot':''}"></div>`;
    flowDiv.appendChild(endW); flowDiv.innerHTML += `<div class="rail-right"></div>`;
    rungEl.appendChild(flowDiv); main.appendChild(rungEl);
  });
}

function toggleWholeRung(key) {
  const [mId, idx] = key.split('-'); const rung = MODULES.find(m => m.id === mId).rungs[Number(idx)];
  const rState = getRungState(key, rung.steps); const { finalFlow } = computeRungFlow(rung.steps, rState);
  rung.steps.forEach((st, i) => {
    if (st.type === 'b') rState[i] = false; else if (st.type === 'or') rState[i] = st.items.map((_, k) => !finalFlow && k === 0);
    else if (st.type !== 'out' && st.type !== 'pen') rState[i] = !finalFlow;
  });
  renderMain();
}
function energizeAllVisible() {
  const mod = MODULES.find(m => m.id === activeId); if (!mod || !mod.rungs) return;
  mod.rungs.forEach((r, idx) => {
    const rState = getRungState(`${mod.id}-${idx}`, r.steps);
    r.steps.forEach((st, i) => { if (st.type==='b') rState[i]=false; else if (st.type==='or') rState[i]=st.items.map((_,k)=>k===0); else if (st.type!=='out'&&st.type!=='pen') rState[i]=true; });
  });
  renderMain();
}
function resetContacts() { Object.keys(stateMap).forEach(k => delete stateMap[k]); renderMain(); }

function getFilteredQuiz() {
  if (quizFilter === 'WRONG') return QUIZ_BANK.map((q, i) => ({ ...q, origIdx: i })).filter(q => wrongSet.has(q.origIdx));
  if (quizFilter !== 'ALL') return QUIZ_BANK.map((q, i) => ({ ...q, origIdx: i })).filter(q => q.cat === quizFilter);
  return QUIZ_BANK.map((q, i) => ({ ...q, origIdx: i }));
}
function setQuizFilter(f) { quizFilter = f; quizIdx = 0; renderMain(); }

function renderQuiz(main) {
  const list = getFilteredQuiz();
  if (quizIdx >= list.length) quizIdx = 0;
  const cats = ['ALL', '소화기구', '상수도용수', '소화수조', '연결송수관', '연결살수', 'WRONG'];
  main.innerHTML = `
    <div class="module-header"><h2>📝 1회차 실전 암기 퀴즈 (${list.length}문항)</h2><span>정답 누적: <b style="color:#10b981;">${quizScore}회</b> | 오답 노트: <b style="color:#ef4444;">${wrongSet.size}문항</b></span></div>
    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;">
      ${cats.map(c => `<button class="btn ${quizFilter===c?'active-filter':''}" onclick="setQuizFilter('${c}')">${c==='ALL'?'전체('+QUIZ_BANK.length+')':c==='WRONG'?'🚨 오답만('+wrongSet.size+')':c}</button>`).join('')}
    </div>`;
  if (!list.length) { main.innerHTML += `<div class="quiz-box">해당 분류에 문항이 없습니다.</div>`; return; }
  const q = list[quizIdx];
  const box = document.createElement('div'); box.className = 'quiz-box';
  box.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.78rem; color:#94a3b8;">
      <span>문항 ${quizIdx + 1} / ${list.length} [${q.cat}]</span>
      <div style="display:flex; gap:6px;"><button class="btn" onclick="prevQuiz(${list.length})">◀ 이전</button><button class="btn" onclick="nextQuiz(${list.length})">다음 ▶</button><button class="btn" onclick="restartQuiz()">🔄 리셋</button></div>
    </div>
    <div class="quiz-q">${escapeHtml(q.q)}</div><div class="quiz-opts" id="quizOpts"></div><div id="quizExp"></div>`;
  main.appendChild(box);
  q.opts.forEach((opt, i) => {
    const b = document.createElement('button'); b.className = 'quiz-opt'; b.textContent = `${i + 1}. ${opt}`;
    b.onclick = () => answerQuiz(i, q); document.getElementById('quizOpts').appendChild(b);
  });
  quizAnswered = false;
}
function answerQuiz(sel, q) {
  if (quizAnswered) return; quizAnswered = true;
  document.querySelectorAll('.quiz-opt').forEach((b, i) => { if (i === q.ans) b.classList.add('correct'); else if (i === sel) b.classList.add('wrong'); });
  if (sel === q.ans) { quizScore++; wrongSet.delete(q.origIdx); } else wrongSet.add(q.origIdx);
  document.getElementById('quizExp').innerHTML = `<div class="quiz-exp"><b>${sel===q.ans?'✅ 정답입니다!':'❌ 오답입니다!'}</b><br>${escapeHtml(q.exp)}</div>`;
}
function nextQuiz(len) { quizIdx = (quizIdx + 1) % len; renderMain(); }
function prevQuiz(len) { quizIdx = (quizIdx - 1 + len) % len; renderMain(); }
function restartQuiz() { quizIdx = 0; quizScore = 0; wrongSet.clear(); renderMain(); }

function renderSimulator(main) {
  main.innerHTML = `
    <div class="module-header"><h2>🎛️ 1회차 공학 계산 시뮬레이터 (소화기구 · 소화수조 · 연결송수관)</h2><span>수치를 입력하면 기준에 따라 능력단위, 소요수량, 채수구, 펌프 양수·토출량이 자동 산출됩니다.</span></div>
    <div class="grid-2">
      <div class="study-card">
        <h3>🧯 소화기구 능력단위 · 완화 · 감소 계산기</h3>
        <div class="form-row"><label>용도 구분</label><select id="c-use" onchange="calcExt()"><option value="30">위락시설 (30㎡/단위)</option><option value="50">문집(전시·동식물외)·의료·장례·문화재 (50㎡)</option><option value="100" selected>공동·근생·판매·업무·공장·창고 등 (100㎡)</option><option value="200">그 밖의 대상물 (200㎡)</option></select></div>
        <div class="form-row"><label>해당 층 바닥면적 (㎡)</label><input type="number" id="c-area" value="1200" oninput="calcExt()"></div>
        <div class="form-row"><label>내화구조+불연/준불연/난연 마감</label><select id="c-fireproof" onchange="calcExt()"><option value="no">미충족 (1배)</option><option value="yes">충족 (기준면적 2배 완화)</option></select></div>
        <div class="form-row"><label>옥내/SP/물분무/옥외/대형 설치</label><select id="c-other" onchange="calcExt()"><option value="no">미설치</option><option value="yes">설치됨</option></select></div>
        <div class="form-row"><label>11층↑ 또는 근생·의료 등 감소제외용도</label><select id="c-excl" onchange="calcExt()"><option value="yes">제외용도 해당 (감소 불가)</option><option value="no">해당안함 (또는 무인변전소)</option></select></div>
        <div class="res-grid" id="c-ext-res"></div>
      </div>

      <div class="study-card">
        <h3>💧 소화수조·저수조 수량 · 채수구 · 가압송수 계산기</h3>
        <div class="form-row"><label>특정소방대상물 연면적 (㎡)</label><input type="number" id="w-total" value="28000" oninput="calcTank()"></div>
        <div class="form-row"><label>1층+2층 바닥면적 합계 (㎡)</label><input type="number" id="w-12" value="16000" oninput="calcTank()"></div>
        <div class="form-row"><label>지하 깊이 (내부바닥까지 m)</label><input type="number" step="0.1" id="w-depth" value="5.2" oninput="calcTank()"></div>
        <div class="res-grid" id="w-tank-res"></div>
      </div>

      <div class="study-card">
        <h3>🚒 연결송수관 펌프 · 수조 · 방수구 판정기</h3>
        <div class="form-row"><label>건축물 유형</label><select id="p-type" onchange="calcPipe()"><option value="gen">일반 건축물</option><option value="apt">계단식 아파트</option></select></div>
        <div class="form-row"><label>지상 층수 (층)</label><input type="number" id="p-fl" value="25" oninput="calcPipe()"></div>
        <div class="form-row"><label>최상층 방수구 높이 (m)</label><input type="number" id="p-h" value="78" oninput="calcPipe()"></div>
        <div class="form-row"><label>해당 층 방수구 개수 (개)</label><input type="number" id="p-no" value="4" oninput="calcPipe()"></div>
        <div class="res-grid" id="p-pipe-res"></div>
      </div>
    </div>`;
  calcExt(); calcTank(); calcPipe();
}

function calcExt() {
  const base = Number(document.getElementById('c-use').value);
  const area = Number(document.getElementById('c-area').value) || 0;
  const dbl = document.getElementById('c-fireproof').value === 'yes';
  const other = document.getElementById('c-other').value === 'yes';
  const excl = document.getElementById('c-excl').value === 'yes';
  const stdArea = base * (dbl ? 2 : 1);
  const units = Math.ceil(area / stdArea);
  const canReduce = other && !excl;
  const reduced = canReduce ? Math.ceil(units / 3) : units;
  document.getElementById('c-ext-res').innerHTML = [
    [`적용 기준면적: ${stdArea}㎡/단위`, true],
    [`기본 필요 능력단위: ${units}단위`, true],
    [canReduce ? `2/3 감소 적용 후: ${reduced}단위 (대형 둔 경우 1/2)` : (other ? '제외용도 해당 → 소형 감소 불가' : '감소 미적용'), canReduce],
    [`간이소화용구 최대 허용: ${Math.floor(units/2)}단위 (노유자 제외)`, false]
  ].map(([t,on])=>`<span class="res-pill ${on?'req':''}">${t}</span>`).join('');
}

function calcTank() {
  const total = Number(document.getElementById('w-total').value) || 0;
  const a12 = Number(document.getElementById('w-12').value) || 0;
  const depth = Number(document.getElementById('w-depth').value) || 0;
  const std = a12 >= 15000 ? 7500 : 12500;
  const mult = Math.ceil(total / std) || 1;
  const vol = mult * 20;
  const hole = vol < 80 ? 1 : 2;
  const port = vol < 40 ? 1 : (vol < 100 ? 2 : 3);
  const flow = vol < 40 ? 1100 : (vol < 100 ? 2200 : 3300);
  const needPump = depth >= 4.5;
  document.getElementById('w-tank-res').innerHTML = [
    [`기준면적: ${std.toLocaleString()}㎡`, true],
    [`소요수량: ${vol}㎥ (20㎥ × ${mult})`, true],
    [`흡수관투입구(0.6m↑): ${hole}개↑`, true],
    [`채수구(65mm↑, 0.5~1m): ${port}개`, true],
    [needPump ? `지하 ${depth}m ≥ 4.5m → 가압송수 필수 (${flow.toLocaleString()} L/min↑)` : `지하 ${depth}m < 4.5m → 가압송수 불필요`, needPump]
  ].map(([t,on])=>`<span class="res-pill ${on?'req':''}">${t}</span>`).join('');
}

function calcPipe() {
  const type = document.getElementById('p-type').value;
  const fl = Number(document.getElementById('p-fl').value) || 0;
  const h = Number(document.getElementById('p-h').value) || 0;
  const no = Math.min(Number(document.getElementById('p-no').value) || 1, 5);
  const wet = h >= 31 || fl >= 11;
  const needPump = h >= 70;
  const baseFlow = type === 'apt' ? 1200 : 2400;
  const addFlow = no > 3 ? (no - 3) * (type === 'apt' ? 400 : 800) : 0;
  const totFlow = baseFlow + addFlow;
  const tankM3 = ((totFlow * 1.5 * 5) / 1000).toFixed(1);
  const dual = fl >= 11 && type !== 'apt';
  const boxCnt = Math.ceil(fl / 3);
  document.getElementById('p-pipe-res').innerHTML = [
    [wet ? '배관방식: 습식설비 필수 (31m↑ 또는 11층↑)' : '건식 가능 (31m↓ & 11층↓)', wet],
    [dual ? '11층 이상 방수구: 쌍구형' : '단구형 가능 (아파트 또는 11층 미만)', true],
    [needPump ? `최상층 ${h}m ≥ 70m → 펌프 필수 (${totFlow.toLocaleString()} L/min, 노즐 0.35MPa↑)` : `최상층 ${h}m < 70m → 가압송수 불필요`, needPump],
    [needPump ? `성능시험 전용수조(150%×5분): ${tankM3}㎥↑ · 비상전원 20분↑` : `방수기구함(3개층마다): 최소 ${boxCnt}개소`, true]
  ].map(([t,on])=>`<span class="res-pill ${on?'req':''}">${t}</span>`).join('');
}

// Init
updateProgress(); renderSidebar(); renderMain();
</script>
</body>
</html>
